base_model: bitext/Mistral-7B-Banking-v2
dataset_dir: artifacts/llm_training/frozen_v1
output_dir: artifacts/llm_training/adapters/atlas_demo-qlora-v1

load_in_4bit: true
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true
bnb_4bit_compute_dtype: bfloat16

lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj

max_seq_length: 512
num_train_epochs: 2
learning_rate: 0.0001
warmup_ratio: 0.03
weight_decay: 0.01
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
gradient_checkpointing: true
max_grad_norm: 0.3
eval_steps: 25
save_steps: 25
logging_steps: 5
save_total_limit: 2
early_stopping_patience: 2
seed: 42
generation:
  max_new_tokens: 192
  temperature: 0.0
  do_sample: false
  top_p: 1.0
