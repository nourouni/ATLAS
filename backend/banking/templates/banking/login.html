{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ATLAS — Atlas Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'banking/login.css' %}">
</head>
<body class="atlas-login" data-theme="light" id="page">
  <svg class="atlas-login__constellation" aria-hidden="true" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
    <defs>
      <filter id="dot-glow-a" x="-400%" y="-400%" width="900%" height="900%"><feGaussianBlur in="SourceGraphic" stdDeviation="3.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="dot-glow-b" x="-400%" y="-400%" width="900%" height="900%"><feGaussianBlur in="SourceGraphic" stdDeviation="3.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <g id="parallax"><g id="drift"><g id="scatter"></g></g></g>
  </svg>
  <div class="atlas-login__mode-switch" role="group" aria-label="Choose color theme">
    <button id="btn-light" class="active" type="button" data-theme-choice="light"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Light</button>
    <button id="btn-dark" type="button" data-theme-choice="dark"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>Dark</button>
  </div>
  <main class="atlas-login__card" aria-label="ATLAS login">
    <div class="atlas-login__brandmark"><img class="atlas-login__logo" src="{% static 'banking/atlas_assistant_icon.svg' %}" alt="Atlas Demo bank"><div class="atlas-login__brand-text"><span>ATLAS</span><small>by Atlas Demo</small></div></div>
    <div class="atlas-login__eyebrow">Welcome back</div>
    <h1>Log in to ATLAS</h1>
    <form method="post" action="{% url 'login' %}" class="atlas-login__form">
      {% csrf_token %}<input type="hidden" name="next" value="{{ next }}">
      {% if error %}<p class="atlas-login__error" role="alert">{{ error }}</p>{% endif %}
      <label for="username">Username</label><div class="atlas-login__field"><input id="username" name="username" type="text" autocomplete="username" value="{{ username|default:'' }}" required autofocus></div>
      <label for="password">Password</label><div class="atlas-login__field"><input id="password" name="password" type="password" autocomplete="current-password" required><button type="button" class="atlas-login__toggle-eye" id="toggle-password" aria-label="Show password"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
      <button type="submit" class="atlas-login__submit">Log in</button>
    </form>
  </main>
  <script src="{% static 'banking/login.js' %}"></script>
</body>
</html>
